[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-client"
version = "0.1.0"
description = "Unofficial reverse-engineered Ozon catalogue client (browser oracle or cookie-jar transport)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13",
]

[project.scripts]
ozon = "ozon_client.cli_shim:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = []

[project.optional-dependencies]
browserfree = ["curl_cffi"]
